<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2356a8"><meta name="description" content="Crea password casuali sul tuo dispositivo. Scegli lunghezza e caratteri, poi copia la tua nuova password."><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>La tua chiave digitale</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><main><header><img src="icon-192.png" width="76" height="76" alt=""><div><p class="eyebrow">IL TUO GENERATORE DI PASSWORD</p><h1>La tua chiave digitale</h1><p>Una nuova password. Ogni volta che vuoi.</p></div></header>
<section class="card"><div class="section-title"><h2>Personalizza la password</h2><button id="theme" class="quiet" type="button" aria-pressed="false">Tema scuro</button></div><label for="length">Lunghezza <span>da 8 a 128 caratteri</span></label><div class="length-row"><input id="range" type="range" min="8" max="128" value="20" aria-label="Lunghezza della password"><input id="length" type="number" min="8" max="128" step="1" value="20" inputmode="numeric"></div><fieldset><legend>Caratteri da utilizzare</legend><div class="options"><label><input type="checkbox" value="upper" checked> Maiuscole <small>A B C</small></label><label><input type="checkbox" value="lower" checked> Minuscole <small>a b c</small></label><label><input type="checkbox" value="digits" checked> Numeri <small>1 2 3</small></label><label><input type="checkbox" value="symbols" checked> Simboli <small>! @ #</small></label></div></fieldset><button id="generate" class="primary" type="button">Genera password <span aria-hidden="true">↗</span></button></section>
<section class="card result"><p class="eyebrow">LA TUA PASSWORD</p><label class="sr-only" for="password">Password generata</label><input id="password" type="password" readonly placeholder="La tua prossima password è qui" autocomplete="off" spellcheck="false"><div class="actions"><button id="show" type="button" disabled>Mostra password</button><button id="copy" class="green" type="button" disabled>Copia password</button></div><p id="status" role="status" aria-live="polite">Scegli le opzioni e premi Genera password.</p></section><footer>Creata sul tuo dispositivo. Le password non vengono salvate né inviate a un server.</footer></main></body></html>
